<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2A52" />
      <stop offset="50%" stop-color="#163870" />
      <stop offset="100%" stop-color="#1E5FA8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="200" height="200" rx="36" fill="url(#bgGrad)" />

  <!-- Inner Soft Accent Ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />
  <circle cx="100" cy="100" r="76" fill="rgba(255, 255, 255, 0.04)" />

  <!-- Shield / Emblem Base -->
  <g filter="url(#subtleShadow)">
    <path d="M100 36 L152 56 V98 C152 132 100 156 100 156 C100 156 48 132 48 98 V56 Z" fill="rgba(255, 255, 255, 0.96)" />
    <path d="M100 42 L146 59 V96 C146 126 100 148 100 148 C100 148 54 126 54 96 V59 Z" fill="#F8FAFC" />
  </g>

  <!-- Golden Crown / Star Badge at Top of Shield -->
  <path d="M100 48 L104 58 L114 59 L106 66 L109 76 L100 70 L91 76 L94 66 L86 59 L96 58 Z" fill="url(#goldGrad)" />

  <!-- School / Graduation Cap Icon -->
  <g transform="translate(100, 102) scale(1.15)">
    <!-- Mortarboard Diamond -->
    <path d="M0 -18 L32 -7 L0 4 L-32 -7 Z" fill="#0B2A52" />
    <!-- Cap Rim / Base -->
    <path d="M-18 -2 V9 C-18 16 18 16 18 9 V-2 C12 2 -12 2 -18 -2 Z" fill="#1E5FA8" />
    <!-- Tassel -->
    <path d="M22 -4 C24 3 26 12 25 20" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="25" cy="21" r="2.5" fill="#D97706" />
    <circle cx="0" cy="-7" r="2" fill="#FBBF24" />
  </g>

  <!-- Open Book Base in Shield -->
  <g transform="translate(100, 134) scale(0.9)">
    <path d="M-24 -4 C-12 -9 -3 -5 0 0 C3 -5 12 -9 24 -4 V10 C12 5 3 9 0 14 C-3 9 -12 5 -24 10 Z" fill="#E2E8F0" />
    <path d="M0 0 V14" stroke="#CBD5E1" stroke-width="1.5" />
    <path d="M-18 0 C-10 -3 -4 -1 0 2" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" />
    <path d="M18 0 C10 -3 4 -1 0 2" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>
