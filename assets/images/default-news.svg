<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="newsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2D59" />
      <stop offset="50%" stop-color="#18437D" />
      <stop offset="100%" stop-color="#24599D" />
    </linearGradient>
    <linearGradient id="newsAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#newsBg)" />

  <!-- Background Geometric Watermark Accents -->
  <circle cx="530" cy="60" r="140" fill="rgba(255, 255, 255, 0.03)" />
  <circle cx="50" cy="290" r="160" fill="rgba(255, 255, 255, 0.02)" />
  <circle cx="300" cy="170" r="220" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="2" stroke-dasharray="6,6" />

  <!-- Central Rounded Badge / Card Backdrop -->
  <rect x="180" y="55" width="240" height="230" rx="28" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" />

  <!-- Megaphone / Announcement & Newspaper Emblem -->
  <g transform="translate(300, 150)">
    <!-- Glow behind icon -->
    <circle cx="0" cy="-5" r="45" fill="rgba(245, 158, 11, 0.25)" filter="url(#softGlow)" />

    <!-- Newspaper Base -->
    <rect x="-38" y="-34" width="76" height="58" rx="8" fill="#FFFFFF" opacity="0.95" />
    <rect x="-30" y="-24" width="30" height="20" rx="3" fill="#0B2A52" />
    <line x1="6" y1="-22" x2="30" y2="-22" stroke="#64748B" stroke-width="3.5" stroke-linecap="round" />
    <line x1="6" y1="-14" x2="26" y2="-14" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
    <line x1="6" y1="-6" x2="28" y2="-6" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
    
    <line x1="-30" y1="6" x2="30" y2="6" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
    <line x1="-30" y1="14" x2="16" y2="14" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />

    <!-- Megaphone Overlapping Accent -->
    <g transform="translate(20, 10) rotate(-15)">
      <path d="M-8 -6 L8 -12 V12 L-8 6 Z" fill="url(#newsAccent)" />
      <path d="M-14 -4 H-8 V4 H-14 Z" fill="#D97706" />
      <ellipse cx="8" cy="0" rx="3" ry="12" fill="#FDE047" />
      <!-- Sound waves -->
      <path d="M14 -7 C17 -3 17 3 14 7" fill="none" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round" />
      <path d="M19 -12 C24 -5 24 5 19 12" fill="none" stroke="rgba(253, 224, 71, 0.7)" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Title / Label -->
  <text x="300" y="244" fill="#FFFFFF" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="19" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    خبر أو إعلان
  </text>
  <text x="300" y="267" fill="#93C5FD" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="12" font-weight="500" text-anchor="middle" opacity="0.9">
    دليل مدارس إسكوبلص
  </text>

  <!-- Bottom Accent Line -->
  <rect x="0" y="334" width="600" height="6" fill="url(#newsAccent)" />
</svg>
