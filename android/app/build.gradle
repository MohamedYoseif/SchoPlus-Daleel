plugins {
    id 'com.android.application'
}

import groovy.json.JsonSlurper

def getAppVersionInfo() {
    def versionFile = file('../../version.json')
    if (!versionFile.exists()) {
        versionFile = file('../../../version.json')
    }
    if (versionFile.exists()) {
        def parsed = new JsonSlurper().parseText(versionFile.text)
        def vName = parsed.version ?: "3.5.76"
        def parts = vName.tokenize('.')
        def major = parts.size() > 0 ? parts[0].toInteger() : 3
        def minor = parts.size() > 1 ? parts[1].toInteger() : 5
        def patch = parts.size() > 2 ? parts[2].toInteger() : 76
        def vCode = (major * 10000) + (minor * 1000) + patch
        return [versionName: vName, versionCode: vCode]
    }
    return [versionName: "3.5.76", versionCode: 35076]
}

def appVersionInfo = getAppVersionInfo()

android {
    namespace 'sd.schoplus.daleel'
    compileSdk 35

    defaultConfig {
        applicationId "sd.schoplus.daleel"
        minSdk 24
        targetSdk 35
        versionCode appVersionInfo.versionCode
        versionName appVersionInfo.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file('../daleel-release-key.jks')
            storePassword 'schoplus2026'
            keyAlias 'schoplus'
            keyPassword 'schoplus2026'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
